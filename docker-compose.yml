services:
  postgres:
    image: postgres:16-alpine
    container_name: onemobility-postgres
    environment:
      POSTGRES_DB: onemobility
      POSTGRES_USER: onemobility
      POSTGRES_PASSWORD: onemobility
    ports:
      - "55433:5432"
    volumes:
      - onemobility-postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onemobility -d onemobility"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onemobility-postgres-data:
